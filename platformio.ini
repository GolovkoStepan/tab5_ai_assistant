; PlatformIO — сборка прошивки M5Stack TAB5 AI Assistant
;
; Платформа pioarduino: официальная espressif32 из PlatformIO не содержит
; ни одного board-файла для ESP32-P4 (проверено на espressif32@8.0.0).
; Версия 55.03.313 = Arduino core 3.3.13 + ESP-IDF 5.5.6.
; Минимум для Tab5 — 55.03.35 (core 3.3.5): в более старых esp32-hal-hosted.c
; не подхватывает SDIO-пины ESP32-C6 и Wi-Fi не поднимается.
; Подробности: docs/BOARD_AI_RESEARCH.md, docs/DECISIONS.md

[platformio]
default_envs = tab5

[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.313
board = m5stack-tab5-p4
framework = arduino

; Та же скорость, что в board-файле, но задаём явно: 1.5 Мбит/с на USB-JTAG
upload_speed = 1500000
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -DCORE_DEBUG_LEVEL=3

; Схему разделов PlatformIO НЕ берёт из поля "arduino.partitions" board-файла —
; нужно указывать явно. default_16MB.csv: два app-слота по 6.25 МБ + spiffs 3.375 МБ.
; Два слота оставляем под будущий OTA (решение Р-009 в docs/DECISIONS.md).
board_build.partitions = default_16MB.csv
board_build.flash_size = 16MB

; Единый список зависимостей с фиксированными версиями.
; Любое изменение — в docs/DEPENDENCIES.md и в CHANGELOG.md.
lib_deps =
    m5stack/M5Unified@0.3.0
    m5stack/M5GFX@0.3.0
    ; Клавиатура A164: официальная библиотека M5Stack
    m5stack/M5UnitUnified@0.6.5
    m5stack/M5Utility@0.3.1
    m5stack/M5HAL@0.1.4
    m5stack/M5Unit-KEYBOARD@0.1.0
    ; Разбор ответов API: переносим на хост, поэтому библиотека нужна и в native
    bblanchon/ArduinoJson@7.4.3

; Юнит-тесты логики на хосте — без железа.
; Собираем только util/: остальное зависит от Arduino и M5GFX.
; Тестируются чистые функции: форматирование, JSON, парсинг SSE, пути.
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -DUNIT_TEST
    -I include
test_framework = unity
test_build_src = yes
build_src_filter = +<util/>
; Тот же ArduinoJson, что в прошивке: разбор ответов модели должен
; проверяться на хосте, а не только на плате.
lib_deps =
    bblanchon/ArduinoJson@7.4.3
